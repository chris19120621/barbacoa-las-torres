{% extends 'base.html' %}{% block title %}Menú de barbacoa{% endblock %}{% block body %}<div class="row g-3"><div class="col-lg-4"><section class="panel"><h5>Agregar producto</h5><form method="post" action="{{url_for('crear_producto')}}"><input type="hidden" name="csrf_token" value="{{csrf_token}}"><label class="form-label mt-2">Nombre</label><input class="form-control" name="nombre" required maxlength="100"><label class="form-label mt-3">Descripción</label><input class="form-control" name="descripcion" maxlength="255"><label class="form-label mt-3">Precio de venta</label><input class="form-control" name="precio" type="number" step="0.01" min="0" required><label class="form-label mt-3">Costo</label><input class="form-control" name="costo" type="number" step="0.01" min="0" required><label class="form-label mt-3">Existencias</label><input class="form-control" name="stock" type="number" min="0" required><input type="hidden" name="stock_minimo" value="5"><button class="btn btn-primary mt-4 w-100">Guardar producto</button></form></section></div><div class="col-lg-8"><section class="panel"><h5>Menú de barbacoa registrados</h5><div class="table-responsive"><table class="table"><thead><tr><th>Nombre</th><th>Precio</th><th>Costo</th><th>Stock</th></tr></thead><tbody>{% for p in productos %}<tr><td>{{p.nombre}}</td><td>${{p.precio}}</td><td>${{p.costo}}</td><td>{{p.stock}}</td></tr>{% else %}<tr><td colspan="4">Sin productos</td></tr>{% endfor %}</tbody></table></div></section></div></div>{% endblock %}
